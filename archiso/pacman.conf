#
# /etc/pacman.conf used inside the build chroot.
# Adds the local TorrentOS repo (./repo/) ahead of the upstream mirrors
# so torrentos-* packages resolve from our own builds.
#

[options]
DisableSandbox
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8

# Suppress DKMS pacman hooks during the mkarchiso pacstrap phase.
# uname -r inside the build chroot returns the CI host kernel (e.g. 5.x-azure),
# not the Arch 'linux' kernel baked into the ISO, so every DKMS module install
# fails with "kernel headers not found" — producing hundreds of identical errors.
# DKMS compiles correctly on the user's first boot against their running kernel.
NoExtract   = usr/share/libalpm/hooks/70-dkms-install.hook
NoExtract   = usr/share/libalpm/hooks/71-dkms-remove.hook
NoExtract   = usr/share/libalpm/hooks/72-dkms-upgrade.hook

[torrentos]
SigLevel = Optional TrustAll
Server = file:///$repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
