# TorrentOS — Apple T2 chip configuration (Intel MacBooks 2018-2020)
#
# The apple-bce module provides:
#   - Keyboard and trackpad (via Apple SPI)
#   - Touch Bar (MBP 2018-2020)
#   - Some audio (routed through T2)
#
# It is provided by apple-bce-dkms and compiled via DKMS on first boot.
# The live ISO will attempt to load it; if not yet compiled it is silently skipped.

# Attempt to load T2 keyboard/SPI module on Intel Macs
softdep apple-bce pre: apple-ibridge
install apple-bce /sbin/modprobe --ignore-install apple-bce; /sbin/modprobe apple-bce 2>/dev/null || true

# Ensure applespi (upstream kernel module for older trackpads) is loaded
softdep applespi pre: spi_pxa2xx_platform intel-lpss-pci
