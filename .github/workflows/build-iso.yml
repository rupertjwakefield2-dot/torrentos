name: Build TorrentOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential gcc-multilib grub-pc-bin grub-common xorriso

      - name: Build kernel + ISO
        run: bash build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: torrentos-${{ github.ref_name }}-${{ github.run_number }}
          path: out/torrentos.iso
          retention-days: 30
